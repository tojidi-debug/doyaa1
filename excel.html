<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GUMIHO EXCEL LAB · 함수 가이드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky:      oklch(94% 0.025 235);
      --sky-soft: oklch(97% 0.012 235);
      --sky-line: oklch(86% 0.035 235);
      --sky-ink:  oklch(31% 0.055 236);
      --ink:      oklch(28% 0.035 158);
      --muted:    oklch(50% 0.025 158);
      --peach:    oklch(88% 0.08 65);
      --accent:   oklch(57% 0.16 250);
      --teal:     oklch(66% 0.13 185);
      --formula-bg:   oklch(96% 0.026 235);
      --formula-txt:  oklch(38% 0.105 245);
      --cat-icon-bg:  oklch(90% 0.065 235);
      --cat-icon-txt: oklch(37% 0.11 245);
      --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
      --shadow-card: 0 4px 16px color-mix(in oklch, var(--sky-ink) 6%, transparent);
      --shadow-lg:   0 24px 64px color-mix(in oklch, var(--sky-ink) 18%, transparent);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: var(--ink); font-family: Verdana, 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 13px; line-height: 1.6; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    :focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: color-mix(in oklch, var(--sky) 94%, transparent);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--sky-line);
    }
    .topbar-inner {
      max-width: 1320px; margin: auto;
      padding: 9px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; text-decoration: none; color: var(--sky-ink); white-space: nowrap; }
    .brand-mark { width: 28px; height: 28px; border-radius: var(--r-sm); background: var(--sky-ink); color: var(--sky-soft); display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
    .search-shell { flex: 1; max-width: 600px; display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 11px; border: 1px solid var(--sky-line); border-radius: var(--r-lg); background: #fff; box-shadow: 0 4px 14px color-mix(in oklch, var(--sky-ink) 5%, transparent); transition: border-color .14s; }
    .search-shell:focus-within { border-color: oklch(70% 0.1 235); }
    .search-shell input { flex: 1; min-width: 0; padding: 5px 0; border: 0; outline: 0; background: transparent; font-size: 12.5px; }
    .search-shell input::placeholder { color: var(--muted); }
    .clear-btn { padding: 4px 9px; border-radius: var(--r-sm); background: var(--sky); color: var(--sky-ink); font-size: 11px; display: none; }
    .clear-btn.show { display: block; }
    .clear-btn:hover { background: var(--sky-line); }
    #resultCount { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }

    /* ── FILTERBAR ── */
    .filterbar {
      position: sticky; top: 49px; z-index: 49;
      background: color-mix(in oklch, #fff 96%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--sky-line);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filterbar::-webkit-scrollbar { display: none; }
    .filter-row {
      max-width: 1320px; margin: auto;
      padding: 0 20px;
      display: flex; align-items: center; gap: 0;
      white-space: nowrap; min-height: 38px;
    }
    .fb-btn {
      padding: 0 11px; height: 38px;
      border: 0; background: transparent;
      font-size: 12px; color: var(--muted);
      transition: color .12s, background .12s;
      border-radius: 0;
      display: flex; align-items: center; gap: 4px;
    }
    .fb-btn:hover { color: var(--sky-ink); background: var(--sky-soft); }
    .fb-btn.active { color: var(--sky-ink); font-weight: 700; }
    .fb-btn.sort-btn { font-size: 11.5px; }
    .sep {
      color: oklch(78% 0.025 235);
      font-size: 13px;
      padding: 0 2px;
      user-select: none;
      pointer-events: none;
    }
    .sep.thick {
      color: oklch(65% 0.04 235);
      padding: 0 4px;
      font-weight: 700;
    }

    /* ── LAYOUT ── */
    .page-wrap { max-width: 1320px; margin: auto; padding: 16px 20px 60px; }
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 9px; }

    /* ── CARDS ── */
    .function-card { border: 1px solid oklch(90% 0.025 235); border-radius: var(--r-lg); background: #fff; box-shadow: var(--shadow-card); cursor: pointer; transition: border-color .14s, background .14s, transform .14s, box-shadow .14s; overflow: hidden; }
    .function-card:hover { border-color: oklch(75% 0.09 235); background: #f6faff; transform: translateY(-2px); box-shadow: 0 8px 24px color-mix(in oklch, var(--sky-ink) 9%, transparent); }
    .function-card.selected { border-color: var(--sky-ink); background: #f3f8ff; }
    .function-select { display: block; width: 100%; min-height: 90px; padding: 12px 13px 10px; border: 0; background: transparent; cursor: pointer; text-align: left; }
    .name-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 5px; }
    .function-name { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; font-weight: 700; color: oklch(36% 0.12 245); line-height: 1.15; }
    .category-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 999px; border: 1px solid oklch(87% 0.05 235); background: oklch(97% 0.018 235); font-size: 10px; color: var(--sky-ink); }
    .category-icon { display: inline-grid; place-items: center; min-width: 15px; height: 15px; padding-inline: 2px; border-radius: 4px; background: var(--cat-icon-bg); color: var(--cat-icon-txt); font-size: 9px; }
    .badge-new { padding: 2px 6px; border-radius: 999px; background: linear-gradient(135deg, oklch(72% 0.18 46), oklch(60% 0.2 18)); color: #fff; font-size: 9.5px; font-weight: 700; }
    .badge-365 { padding: 2px 5px; border-radius: 999px; background: oklch(93% 0.04 240); color: oklch(38% 0.12 245); font-size: 9px; font-weight: 700; border: 1px solid oklch(83% 0.07 240); }
    .complexity-dots { display: flex; gap: 2px; margin-left: auto; align-items: center; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sky-line); }
    .dot.on-1 { background: oklch(62% 0.14 155); }
    .dot.on-2 { background: oklch(72% 0.16 70); }
    .dot.on-3 { background: oklch(60% 0.18 25); }
    .card-summary { font-size: 11.5px; color: oklch(42% 0.03 235); line-height: 1.5; margin-bottom: 6px; }
    .mini-formula { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; color: var(--formula-txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty-state { grid-column: 1/-1; padding: 56px 20px; text-align: center; border: 1.5px dashed var(--sky-line); border-radius: var(--r-xl); }
    .empty-state strong { display: block; font-size: 16px; margin-bottom: 6px; }
    .empty-state p { color: var(--muted); font-size: 12px; }

    /* ── DETAIL MODAL ── */
    .detail-backdrop { position: fixed; inset: 0; z-index: 40; border: 0; background: color-mix(in oklch, var(--sky-ink) 20%, transparent); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .2s ease-out; }
    .detail-backdrop.open { opacity: 1; pointer-events: auto; }
    .detail-pane { position: fixed; z-index: 41; top: 50%; left: 50%; width: min(460px, calc(100vw - 20px)); max-height: calc(100vh - 20px); overflow-y: auto; border: 1px solid oklch(82% 0.07 235); border-radius: var(--r-xl); background: #fff; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transform: translate(-50%, calc(-50% + 12px)) scale(.97); transition: transform .24s cubic-bezier(.22,1,.36,1), opacity .18s ease-out; }
    .detail-pane.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .detail-inner { display: grid; gap: 9px; padding: 14px 16px 16px; }
    /* 상단 바: 이름/뱃지 + [가이드 복사][✕] */
    .detail-topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .detail-topbar .name-wrap { flex: 1; min-width: 0; }
    .detail-topbar .function-name { font-size: 16px; }
    .detail-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; margin-top: 1px; }
    .detail-close { display: grid; place-items: center; width: 26px; height: 26px; border-radius: var(--r-sm); border: 1px solid var(--sky-line); background: var(--sky-soft); color: var(--sky-ink); font-size: 13px; transition: background .14s; }
    .detail-close:hover { background: var(--sky-line); }
    /* 섹션 헤더 행 */
    .section-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .detail-pane .card-summary { min-height: 0; margin: 0; font-size: 12.5px; }
    .label { display: block; margin-bottom: 4px; font-size: 9px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
    .formula-box { padding: 8px 10px; border-radius: var(--r-md); font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; line-height: 1.55; word-break: break-all; white-space: pre-wrap; }
    .formula-box.syntax { border: 1px solid var(--accent); background: var(--accent); color: oklch(98% 0.005 235); }
    .formula-box.example { border: 1px solid oklch(86% 0.055 235); background: var(--formula-bg); color: var(--formula-txt); }
    .logic-note { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .logic-pill { padding: 3px 8px; border-radius: 7px; background: oklch(95% 0.055 65); color: oklch(43% 0.1 55); font-size: 11px; font-weight: 700; }
    .arg-list { display: grid; gap: 0; }
    .arg-row { display: grid; grid-template-columns: minmax(68px, .33fr) 1fr; gap: 7px; padding: 4px 0; border-bottom: 1px dashed var(--sky-line); font-size: 11px; }
    .arg-row:last-child { border-bottom: 0; }
    .arg-row dt { color: oklch(40% 0.09 240); font-weight: 700; }
    .arg-row dd { color: var(--muted); }
    .step-list { list-style: none; padding: 0; display: grid; gap: 7px; counter-reset: steps; }
    .step-list li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; align-items: start; font-size: 11px; }
    .step-list li::before { counter-increment: steps; content: counter(steps); display: grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--peach); font-size: 9.5px; font-weight: 700; }
    .result-box { padding: 7px 10px; border-radius: var(--r-sm); border: 1px solid oklch(82% 0.07 235); background: var(--sky-soft); font-size: 11.5px; color: var(--sky-ink); }
    .tip { padding: 7px 10px; border-radius: var(--r-sm); background: oklch(96% 0.035 65); color: oklch(42% 0.09 55); font-size: 10.5px; line-height: 1.55; }
    /* 인라인 복사 버튼 */
    .inline-copy { padding: 3px 9px; border-radius: var(--r-sm); border: 1px solid var(--sky-line); background: #fff; color: var(--sky-ink); font-size: 10.5px; font-weight: 700; white-space: nowrap; transition: background .12s, transform .1s; cursor: pointer; }
    .inline-copy:hover { background: var(--sky-soft); transform: translateY(-1px); }
    .inline-copy.primary { border-color: var(--teal); background: var(--teal); color: oklch(99% 0.002 185); }
    .inline-copy.primary:hover { background: oklch(60% 0.14 185); }
    /* ── TOP 버튼 ── */
    #topBtn { position: fixed; bottom: 22px; right: 22px; z-index: 50; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--sky-line); background: #fff; color: var(--sky-ink); font-size: 16px; box-shadow: 0 2px 10px color-mix(in oklch,var(--sky-ink) 12%,transparent); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; display: grid; place-items: center; cursor: pointer; }
    #topBtn.visible { opacity: 1; pointer-events: auto; }
    #topBtn:hover { background: var(--sky-soft); transform: translateY(-2px); }

    .toast { position: fixed; z-index: 60; left: 50%; bottom: 24px; padding: 10px 18px; border-radius: 999px; background: var(--sky-ink); color: oklch(97% 0.005 235); font-size: 12.5px; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transform: translate(-50%, 14px); transition: opacity .2s ease-out, transform .2s ease-out; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 600px) {
      .topbar-inner { padding: 8px 14px; }
      .page-wrap { padding-inline: 14px; }
      #resultCount { display: none; }
      .detail-pane { top: auto; bottom: 0; left: 0; right: 0; width: 100%; max-height: 94vh; border-radius: var(--r-xl) var(--r-xl) 0 0; transform: translateY(20px); }
      .detail-pane.open { transform: translateY(0); }
      .detail-inner { padding: 16px 16px 28px; }
      .results { grid-template-columns: 1fr; }
      .arg-row { grid-template-columns: 1fr; gap: 2px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  
    /* ── GUMIHO EXCEL INFOGRAPHIC REDESIGN ── */
    :root{--g-cobalt:oklch(48% .16 251);--g-navy:oklch(30% .09 252);--g-sky:oklch(72% .13 231);--g-ice:oklch(97% .018 235);--g-line:oklch(88% .035 235);--excel:oklch(47% .13 151)}
    body{min-width:980px;background:linear-gradient(180deg,var(--g-ice),oklch(95% .014 235));color:oklch(28% .035 248);scrollbar-color:oklch(72% .11 230) #fff}
    .topbar{background:color-mix(in oklch,#fff 96%,var(--g-ice));border-color:var(--g-line);box-shadow:0 7px 24px color-mix(in oklch,var(--g-navy) 8%,transparent)}
    .topbar-inner{width:98%;max-width:none;min-height:62px;padding:8px 14px;gap:14px}
    .brand{gap:10px;min-width:230px;color:var(--g-navy)}
    .gumiho-fox{position:relative;width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:1px solid oklch(72% .1 230);border-radius:14px;background:linear-gradient(145deg,var(--g-cobalt),var(--g-sky));font-size:25px;box-shadow:0 7px 16px color-mix(in oklch,var(--g-cobalt) 24%,transparent);animation:foxFloatExcel 4.8s cubic-bezier(.25,1,.5,1) infinite}
    .gumiho-fox::after{content:'✦';position:absolute;right:-7px;top:-5px;color:var(--g-sky);font-size:9px;animation:foxSparkExcel 2.4s ease-in-out infinite}
    .brand-copy{display:flex;flex-direction:column;line-height:1}.brand-copy strong{font-size:13.5px;letter-spacing:.055em;color:var(--g-navy)}.brand-copy small{margin-top:5px;color:oklch(52% .09 233);font-size:7.5px;font-weight:800;letter-spacing:.16em}
    .search-shell{max-width:720px;min-height:40px;border-color:var(--g-line);border-radius:12px;box-shadow:0 4px 16px color-mix(in oklch,var(--g-navy) 6%,transparent)}.search-shell:focus-within{border-color:var(--g-sky);box-shadow:0 0 0 3px color-mix(in oklch,var(--g-sky) 16%,transparent)}
    .clear-btn{background:oklch(94% .035 231);color:var(--g-cobalt)}#resultCount{padding:5px 10px;border:1px solid var(--g-line);border-radius:999px;background:var(--g-ice);color:oklch(49% .07 238)}
    .filterbar{top:62px;background:color-mix(in oklch,var(--g-ice) 94%,transparent);border-color:var(--g-line)}.filter-row{width:98%;max-width:none;min-height:42px;padding:0 14px;gap:3px}.fb-btn{height:34px;padding:0 10px;border-radius:8px;color:oklch(48% .035 239)}.fb-btn:hover{background:oklch(92% .045 232);color:var(--g-cobalt)}.fb-btn.active{background:#fff;color:var(--g-cobalt);box-shadow:0 2px 8px color-mix(in oklch,var(--g-navy) 9%,transparent)}
    .page-wrap{width:98%;max-width:none;padding:18px 14px 60px}.results{grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px}
    .function-card{position:relative;min-height:158px;border-color:var(--g-line);border-radius:14px;background:color-mix(in oklch,#fff 96%,var(--g-ice));box-shadow:0 5px 18px color-mix(in oklch,var(--g-navy) 6%,transparent)}.function-card:hover{border-color:oklch(75% .09 233);background:#fff;box-shadow:0 10px 26px color-mix(in oklch,var(--g-navy) 10%,transparent)}.function-select{min-height:158px;padding:42px 14px 13px}
    .card-number{position:absolute;left:13px;top:11px;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:var(--g-cobalt);color:#fff;font-size:9px;font-weight:800;box-shadow:0 4px 10px color-mix(in oklch,var(--g-cobalt) 22%,transparent)}
    .function-card:nth-child(4n+2) .card-number{background:oklch(53% .15 295)}.function-card:nth-child(4n+3) .card-number{background:var(--excel)}.function-card:nth-child(4n) .card-number{background:oklch(55% .14 330)}
    .function-card[data-category="조회·참조"]{background:oklch(97% .025 235);border-color:oklch(87% .05 235)}.function-card[data-category="텍스트"]{background:oklch(97% .025 178);border-color:oklch(87% .05 178)}.function-card[data-category="날짜·시간"]{background:oklch(97% .03 105);border-color:oklch(88% .055 105)}.function-card[data-category="논리·오류"]{background:oklch(97% .027 45);border-color:oklch(88% .055 45)}.function-card[data-category="동적 배열"]{background:oklch(97% .027 292);border-color:oklch(88% .05 292)}.function-card[data-category="집계·보고서"]{background:oklch(97% .022 215);border-color:oklch(88% .047 215)}.function-card[data-category="고급 수식"]{background:oklch(97% .025 340);border-color:oklch(88% .05 340)}
    .function-card.selected{border-color:var(--g-cobalt);background:#fff;box-shadow:0 0 0 2px color-mix(in oklch,var(--g-cobalt) 12%,transparent)}.function-name{color:var(--g-cobalt)}.category-badge{border-color:color-mix(in oklch,var(--g-sky) 35%,var(--g-line));background:#fff;color:var(--g-navy)}
    .detail-pane{width:min(780px,calc(100vw - 28px));border-color:oklch(78% .075 235);border-radius:18px;background:color-mix(in oklch,#fff 98%,var(--g-ice));box-shadow:0 24px 64px color-mix(in oklch,var(--g-navy) 20%,transparent)}.detail-inner{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:18px}.detail-topbar,.detail-inner>.card-summary,.detail-inner>div:nth-of-type(2),.detail-inner>.tip{grid-column:1/-1}.detail-topbar{align-items:center}.detail-fox{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,var(--g-cobalt),var(--g-sky));font-size:29px;box-shadow:0 6px 15px color-mix(in oklch,var(--g-cobalt) 22%,transparent)}.detail-pane .function-name{font-size:26px;line-height:1;color:var(--excel);letter-spacing:-.02em}.formula-box.syntax{border-color:var(--g-cobalt);background:linear-gradient(120deg,var(--g-navy),var(--g-cobalt))}.inline-copy.primary{border-color:var(--g-sky);background:var(--g-cobalt)}

   arguments:[['조건식','TRUE/FALSE 배열; 곱셈은 AND'],['OR 조건','두 조건 합이 0보다 큰지 검사'],['합계범위','조건을 만족할 때 더할 숫자']],
   example:'=SUMPRODUCT(($B$1:$B$500=$A1)*($C$1:$C$500>0)*$D$1:$D$500)',
   steps:['B열=A1과 C열>0 조건 배열 생성','두 배열을 곱해 AND 조건 적용','TRUE 행의 D열 금액만 합산'],
   result:'두 조건을 동시에 만족하는 D열 합계',
   tips:'OR 조건은 --((조건1)+(조건2)>0)을 사용. 전체 열 참조보다 실제 데이터 범위를 지정하는 편이 빠름.',
   logic:['* = AND (모두 만족)','--((조건1)+(조건2)>0) = OR'],
   keywords:'sumproduct and or 배열 조건 합계 복합 조건 논리 집계'},
  {name:'WEIGHTED AVERAGE',category:'집계·보고서',priority:56,complexity:2,
   summary:'값마다 다른 중요도·수량을 반영한 가중평균 계산',
   syntax:'=SUMPRODUCT(값범위, 가중치범위)/SUM(가중치범위)',
   arguments:[['값범위','평균을 구할 단가·수익률 등'],['가중치범위','수량·잔액·비중 등']],
   example:'=SUMPRODUCT($B$1:$B$500, $C$1:$C$500)/SUM($C$1:$C$500)',
   steps:['B열 값과 C열 가중치를 행별로 곱함','곱한 값의 전체 합계 계산','전체 가중치 합계로 나눔'],
   result:'C열 비중을 반영한 B열 가중평균',
   tips:'가중치 합계가 0일 수 있으면 IFERROR 또는 분모 검사를 추가.',
   keywords:'가중평균 weighted average sumproduct 수익률 단가 비중'},
  {name:'UNIQUE COUNT (LEGACY)',category:'집계·보고서',priority:55,complexity:3,
   summary:'동적 배열 함수 없이 중복을 제외한 고유 항목 수 계산',
   syntax:'=SUMPRODUCT((범위<>"")/COUNTIF(범위, 범위&""))',
   arguments:[['범위','고유 개수를 셀 목록'],['범위<>""','빈 셀을 집계에서 제외'],['COUNTIF','각 값의 전체 등장 횟수']],
   example:'=SUMPRODUCT(($B$1:$B$500<>"")/COUNTIF($B$1:$B$500, $B$1:$B$500&""))',
   steps:['각 값의 중복 횟수 계산','각 행을 중복 횟수의 역수로 변환','빈 셀을 제외하고 모두 합산'],
   result:'B1:B500의 중복 없는 항목 개수',
   tips:'Microsoft 365에서는 =ROWS(UNIQUE(FILTER(범위,범위<>"")))가 더 읽기 쉬움.',
   keywords:'고유 개수 중복 제외 distinct count 구버전 sumproduct countif'},
  {name:'RUNNING TOTAL BY GROUP',category:'집계·보고서',priority:54,complexity:3,
   summary:'항목별로 초기화되는 누적 합계를 행마다 계산',
   syntax:'=SUMIFS(누적합계범위, 누적조건범위, 현재항목)',
   arguments:[['누적합계범위','첫 행은 고정하고 끝 행만 현재 행까지 확장'],['누적조건범위','같은 방식으로 확장할 그룹 열'],['현재항목','현재 행의 거래처·부서 등']],
   example:'=SUMIFS($C$1:C1, $B$1:B1, $A1)',
   steps:['C열 합계 범위를 첫 행부터 현재 행까지 확장','B열 조건 범위도 같은 행까지 확장','A1 항목과 같은 행의 금액만 누적'],
   result:'항목이 달라지면 별도로 누적되는 그룹별 누계',
   tips:'원본이 거래일 순서로 정렬되어 있어야 시간 흐름에 맞는 누계가 됨.',
   keywords:'그룹별 누계 누적 합계 running total sumifs 거래처별 누적'},
  {name:'TRIM+CLEAN',category:'텍스트',priority:47,complexity:2,
   summary:'웹·시스템 자료의 숨은 문자와 불규칙 공백을 함께 정리',
   syntax:'=TRIM(CLEAN(SUBSTITUTE(텍스트, CHAR(160), " ")))',
   arguments:[['텍스트','정리할 원본 셀'],['SUBSTITUTE+CHAR(160)','웹에서 들어온 줄바꿈되지 않는 공백을 일반 공백으로 변환'],['CLEAN','제어 문자 제거'],['TRIM','앞뒤 공백과 중복 공백 정리']],
   example:'=TRIM(CLEAN(SUBSTITUTE(A2, CHAR(160), " ")))',
   steps:['CHAR(160) 특수 공백을 일반 공백으로 변경','CLEAN으로 인쇄되지 않는 제어 문자 제거','TRIM으로 앞뒤·연속 공백 정리'],
   result:'눈에 보이지 않는 문자까지 제거된 비교·조회 가능한 텍스트',
   tips:'정리 전후 값이 같아 보여도 XLOOKUP 불일치가 해결될 수 있음. 숫자 변환이 필요하면 VALUE로 한 번 더 감쌈.',
   keywords:'데이터 정리 공백 제거 숨은 문자 nbsp char160 trim clean substitute 웹 데이터'}
];

const CATEGORY_ORDER = ['전체','동적 배열','조회·참조','텍스트','고급 수식','집계·보고서','논리·오류','날짜·시간'];
const CAT_ICON = {'전체':'✦','동적 배열':'⚡','조회·참조':'🔍','텍스트':'📝','고급 수식':'🧮','집계·보고서':'📊','논리·오류':'🛡️','날짜·시간':'📅'};
const SORT_OPTS = [['name','이름순'],['recommended','추천순'],['complexity-asc','복잡성↑'],['complexity-desc','복잡성↓']];

const state = {query:'',category:'전체',sort:'name',selectedName:null};
const $id = id => document.getElementById(id);
function norm(s){return String(s||'').toLocaleLowerCase('ko-KR').replace(/[\s._·\-\/\\]+/g,'');}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function complexityDots(c){
  const col=['','oklch(62% 0.14 155)','oklch(72% 0.16 70)','oklch(60% 0.18 25)'];
  return [1,2,3].map(i=>`<span class="dot${i<=c?' on-'+c:''}" style="${i<=c?'background:'+col[c]:''}"></span>`).join('');
}

function scoreFunction(entry,q){
  const nq=norm(q);
  if(!nq)return entry.priority;
  const nm=norm(entry.name),all=norm([entry.name,entry.category,entry.summary,entry.syntax,entry.keywords,entry.tips].join(' '));
  let sc=0;
  if(nm===nq)sc+=1000; else if(nm.startsWith(nq))sc+=700; else if(nm.includes(nq))sc+=500;
  if(norm(entry.keywords||'').includes(nq))sc+=360;
  if(norm(entry.summary).includes(nq))sc+=240;
  if(all.includes(nq))sc+=120;
  const tokens=q.toLocaleLowerCase('ko-KR').split(/\s+/).filter(Boolean);
  const hits=tokens.filter(t=>all.includes(norm(t))).length;
  if(tokens.length&&hits===tokens.length)sc+=80+hits*20;
  return sc;
}

function getVisible(){
  let list=FUNCTIONS.map(f=>({f,sc:scoreFunction(f,state.query)}))
    .filter(x=>state.category==='전체'||x.f.category===state.category)
    .filter(x=>!state.query||x.sc>0);
  switch(state.sort){
    case 'name': list.sort((a,b)=>a.f.name.localeCompare(b.f.name,'ko-KR')); break;
    case 'recommended': list.sort((a,b)=>b.sc-a.sc||b.f.priority-a.f.priority); break;
    case 'complexity-asc': list.sort((a,b)=>a.f.complexity-b.f.complexity||a.f.name.localeCompare(b.f.name)); break;
    case 'complexity-desc': list.sort((a,b)=>b.f.complexity-a.f.complexity||a.f.name.localeCompare(b.f.name)); break;
  }
  return list.map(x=>x.f);
}

function renderFilterbar(){
  const cats = CATEGORY_ORDER.map((cat,i) => {
    const cnt = cat==='전체' ? FUNCTIONS.length : FUNCTIONS.filter(f=>f.category===cat).length;
    const active = state.category===cat;
    return (i>0?'<span class="sep" aria-hidden="true">|</span>':'')+
      `<button class="fb-btn${active?' active':''}" data-category="${cat}" aria-pressed="${active}">${CAT_ICON[cat]} ${cat}<span style="color:var(--muted);font-size:10.5px;margin-left:3px">${cnt}</span></button>`;
  }).join('');

  const sorts = SORT_OPTS.map(([ key,label],i) =>
    (i>0?'<span class="sep" aria-hidden="true">|</span>':'')+
    `<button class="fb-btn sort-btn${state.sort===key?' active':''}" data-sort="${key}" aria-pressed="${state.sort===key}">${label}</button>`
  ).join('');

  $id('filterRow').innerHTML = cats + '<span class="sep thick" aria-hidden="true">|</span>' + sorts;
}

function renderResults(){
  const visible=getVisible();
  $id('resultCount').textContent=`${visible.length} / ${FUNCTIONS.length}개`;
  if(!visible.length){
    $id('results').innerHTML=`<div class="empty-state"><span class="empty-fox" aria-hidden="true">🦊</span><strong>함수를 찾지 못했어요.</strong><p>다른 표현으로 검색해 보세요.</p></div>`;
    return;
  }
  $id('results').innerHTML=visible.map((f,i)=>`
    <article class="function-card${state.selectedName===f.name?' selected':''}" data-name="${esc(f.name)}" data-category="${esc(f.category)}">
      <button type="button" class="function-select" data-action="select" aria-label="${esc(f.name)} 상세 보기">
        <div class="name-wrap">
          <span class="card-number">${String(i+1).padStart(2,'0')}</span>
          <span class="function-name">${esc(f.name)}</span>
          <span class="category-badge"><span class="category-icon">${CAT_ICON[f.category]||''}</span>${esc(f.category)}</span>
          ${f.isNew?'<span class="badge-new">🆕 NEW</span>':''}${f.isMs365?'<span class="badge-365">M365</span>':''}
          <span class="complexity-dots" title="복잡성">${complexityDots(f.complexity)}</span>
        </div>
        <p class="card-summary">${esc(f.summary)}</p>
        <div class="mini-formula">${esc(f.example)}</div>
      </button>
    </article>`).join('');
}

function render(){renderFilterbar();renderResults();}

function guideText(f){
  return`${f.name} — ${f.summary}\n\n구문\n${f.syntax}\n\n인수\n${f.arguments.map(([k,v])=>`- ${k}: ${v}`).join('\n')}\n\n예제\n${f.example}\n\n적용 순서\n${f.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n\n결과\n${f.result}\n\n팁\n${f.tips}`;
}

function renderDetail(f){
  if(!f){$id('detailPane').innerHTML='';return;}
  const args=f.arguments.map(([k,v])=>`<div class="arg-row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
  const steps=f.steps.map(s=>`<li>${esc(s)}</li>`).join('');
  const logic=f.logic?`<div class="logic-note">${f.logic.map(l=>`<span class="logic-pill">${esc(l)}</span>`).join('')}</div>`:'';
  $id('detailPane').innerHTML=`<div class="detail-inner">
    <div class="detail-topbar">
      <span class="detail-fox" aria-hidden="true">🦊</span>
      <div class="name-wrap" style="flex-wrap:wrap;gap:5px;margin-bottom:0">
        <span class="function-name">${esc(f.name)}</span>
        <span class="category-badge"><span class="category-icon">${CAT_ICON[f.category]||''}</span>${esc(f.category)}</span>
        ${f.isNew?'<span class="badge-new">🆕 NEW</span>':''}${f.isMs365?'<span class="badge-365">M365</span>':''}
        <span class="complexity-dots">${complexityDots(f.complexity)}</span>
      </div>
      <div class="detail-actions">
        <button type="button" class="inline-copy" data-action="copy-guide">📄 가이드 복사</button>
        <button type="button" class="detail-close" data-action="close" aria-label="닫기">✕</button>
      </div>
    </div>
    <p class="card-summary">${esc(f.summary)}</p>
    <div>
      <div class="section-row"><span class="label">📌 함수 구조</span><button type="button" class="inline-copy primary" data-action="copy-formula">📋 수식 복사</button></div>
      <div class="formula-box syntax">${esc(f.syntax)}</div>
    </div>
    <div><span class="label">🧪 예제</span><div class="formula-box example">${esc(f.example)}</div>${logic}</div>
    <div><span class="label">📋 인수 설명</span><dl class="arg-list">${args}</dl></div>
    <div><span class="label">🪜 적용 순서</span><ol class="step-list">${steps}</ol></div>
    <div><span class="label">✅ 결과</span><div class="result-box">${esc(f.result)}</div></div>
    <p class="tip">💡 ${esc(f.tips)}</p>
  </div>`;
}

function openDetail(f){
  state.selectedName=f.name; renderResults(); renderDetail(f);
  $id('detailPane').classList.add('open'); $id('detailBackdrop').classList.add('open');
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>$id('detailPane').querySelector('.detail-close')?.focus());
}
function closeDetail(){
  state.selectedName=null;
  $id('detailPane').classList.remove('open'); $id('detailBackdrop').classList.remove('open');
  document.body.style.overflow=''; renderResults();
}

let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer); $id('toast').textContent=msg; $id('toast').classList.add('show');
  toastTimer=setTimeout(()=>$id('toast').classList.remove('show'),2000);
}
async function copyText(text,label){
  try{
    if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
    else{const a=document.createElement('textarea');a.value=text;a.style.cssText='position:fixed;opacity:0;';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}
    showToast(`✅ ${label}을 복사했어요`);
  }catch{showToast('복사하지 못했어요.');}
}

/* ── EVENTS ── */
$id('searchInput').addEventListener('input',e=>{
  state.query=e.target.value.trim();
  $id('clearSearch').classList.toggle('show',!!state.query); renderResults();
});
$id('clearSearch').addEventListener('click',()=>{
  $id('searchInput').value=''; state.query=''; $id('clearSearch').classList.remove('show');
  renderResults(); $id('searchInput').focus();
});
$id('filterRow').addEventListener('click',e=>{
  const btn=e.target.closest('[data-category]');
  if(btn){state.category=btn.dataset.category; render(); return;}
  const srt=e.target.closest('[data-sort]');
  if(srt){state.sort=srt.dataset.sort; render();}
});
$id('results').addEventListener('click',e=>{
  const btn=e.target.closest('[data-action="select"]');
  if(!btn)return;
  const card=btn.closest('[data-name]');
  const f=FUNCTIONS.find(x=>x.name===card?.dataset?.name);
  if(f)openDetail(f);
});
$id('results').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const btn=e.target.closest('[data-action="select"]'); if(!btn)return; e.preventDefault();
  const card=btn.closest('[data-name]');
  const f=FUNCTIONS.find(x=>x.name===card?.dataset?.name); if(f)openDetail(f);
});
$id('detailPane').addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]'); if(!btn)return;
  if(btn.dataset.action==='close'){closeDetail();return;}
  const f=FUNCTIONS.find(x=>x.name===state.selectedName); if(!f)return;
  if(btn.dataset.action==='copy-formula')copyText(f.example,'수식');
  if(btn.dataset.action==='copy-guide')copyText(guideText(f),'가이드');
});
$id('detailBackdrop').addEventListener('click',closeDetail);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($id('detailPane').classList.contains('open')){closeDetail();return;}if(state.query)$id('clearSearch').click();}
  if(e.key==='/'&&document.activeElement!==$id('searchInput')){e.preventDefault();$id('searchInput').focus();}
});

  // TOP 버튼
  window.addEventListener('scroll', () => {
    const btn = document.getElementById('topBtn');
    if (btn) btn.classList.toggle('visible', window.scrollY > 300);
  }, { passive: true });

render();
</script>

  <button id="topBtn" aria-label="맨 위로" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
</body>
</html>
