<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="ClaudeBot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[품감] 통합</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f9; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .bar { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; background: #fff; border-bottom: 1px solid #d9e1ea; white-space: nowrap; }
  .bar b { color: #1f3a5f; font-size: 13px; margin-right: 8px; }
  .bar button { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 14px; border: 1px solid #c9d3df; border-radius: 8px; background: #f4f6f9; color: #1f3a5f; cursor: pointer; }
  .bar button.on { background: #e8f0fb; border-color: #0d5ba8; color: #0d5ba8; }
  /* 과징금(구) #C00000 · 과징금(신) 청록 (사용자 지정 2026-11-12) — 고른 탭은 테두리 띠로 표시 */
  .bar button.pen-old { background: #C00000; border-color: #C00000; color: #fff; }
  .bar button.pen-old:hover { background: #a30000; border-color: #a30000; }
  .bar button.pen-old.on { background: #a30000; border-color: #7a0000; color: #fff; box-shadow: 0 0 0 3px rgba(192, 0, 0, .22); }
  .bar button.pen-new { background: #0f766e; border-color: #0f766e; color: #fff; }
  .bar button.pen-new:hover { background: #115e59; border-color: #115e59; }
  .bar button.pen-new.on { background: #115e59; border-color: #0b4f4a; color: #fff; box-shadow: 0 0 0 3px rgba(15, 118, 110, .22); }
  .bar .sp { flex: 1; }
  .bar a { font-size: 12px; color: #c5cbd3; text-decoration: none; margin-left: 4px; }
  .bar a:hover { color: #9aa3ad; text-decoration: underline; }
  iframe { display: block; width: 100%; height: calc(100% - 39px); border: 0; background: #fff; }
  iframe[hidden] { display: none; }
</style>
</head>
<body>
  <div class="bar" role="tablist">
    <b>QC</b>
    <button type="button" data-tab="total" role="tab">[품감] 통합</button>
    <button type="button" data-tab="creport" role="tab">신용정보 조회</button>
    <span class="sp"></span>
    <button type="button" class="pen-old" data-tab="penaltyold" role="tab" title="과징금 산정 — (구) 기준">OLD</button>
    <button type="button" class="pen-new" data-tab="penaltynew" role="tab" title="과징금 산정 — (신) 기준">NEW</button>
    <a href="../penalty/index.html" title="과징금 산정 화면만 따로 열기">★과징금</a>
  </div>
  <iframe id="f-total" data-src="total.html" title="[품감] 통합" hidden></iframe>
  <iframe id="f-creport" data-src="creport/" title="신용정보 조회" hidden></iframe>
  <iframe id="f-penaltyold" data-src="../penalty/index.html" title="OLD" hidden></iframe>
  <iframe id="f-penaltynew" data-src="../penalty/new.html" title="NEW" hidden></iframe>
<script>
/* 화면을 각자 틀에 띄워 둔다 — 탭을 바꿔도 작업 중인 화면이 그대로 남는다(처음 누를 때 불러옴).
   「신용정보 조회」는 품감이 아니어도 쓰는 별개 화면이다. 통합 화면의 개별선정에서 [신용정보 조회로 보내기]를 누르면 #creport 로 넘어온다.
   과징금(구)·(신)은 입력을 이 브라우저(localStorage)로 같이 쓰므로, 탭을 열 때마다 다시 불러 방금 넣은 값이 보이게 한다.
   과징금 화면 안의 [과징금(신)으로 산출]·[과징금(구)로 산출] 단추는 #menu=penalty_new · #menu=penalty_fine 으로 이 틀에 알린다. */
(function () {
  const PEN = ['penaltyold', 'penaltynew'];
  const TABS = ['total', 'creport'].concat(PEN);
  const pick = (t) => {
    if (!TABS.includes(t)) t = 'total';
    document.querySelectorAll('.bar button').forEach((b) => { const on = b.dataset.tab === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
    document.querySelectorAll('iframe').forEach((f) => {
      const on = f.id === 'f-' + t;
      if (on && !f.getAttribute('src')) f.src = f.dataset.src;
      else if (on && f.hidden && PEN.includes(t)) { try { f.contentWindow.location.replace(f.src); } catch (e) { f.src = f.dataset.src; } }
      f.hidden = !on;
    });
    try { localStorage.setItem('qc.shell.tab', t); } catch (e) { /* */ }
    if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  };
  document.querySelectorAll('.bar button').forEach((b) => b.addEventListener('click', () => pick(b.dataset.tab)));
  const fromHash = () => {
    const t = (location.hash || '').slice(1);
    if (t === 'menu=penalty_fine') return 'penaltyold';
    if (t === 'menu=penalty_new') return 'penaltynew';
    return TABS.includes(t) ? t : 'total';   // 예전 주소(#review · #sample)나 주소에 탭이 없으면 통합부터
  };
  pick(fromHash());
  window.addEventListener('hashchange', () => pick(fromHash()));
})();
</script>
</body>
</html>
